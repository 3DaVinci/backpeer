name: coordinator
description: Центральный координатор (метаданные, аудиты, репутация узлов). Без Flutter.
version: 0.0.3-dev.4
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

# Выбор и лицензии — ADR-005.
dependencies:
  # Команды serve и migrate (BSD-3-Clause), как в cli.
  args: ^2.7.0
  core: ^0.0.3-dev.4
  # Int64 полей Protobuf (BSD-3-Clause, уже в core).
  fixnum: ^1.1.1
  # Журнал; формат JSON Lines — свой (BSD-3-Clause).
  logging: ^1.3.0
  # PostgreSQL: пул, транзакции (BSD-3-Clause).
  postgres: ^3.5.20
  protobuf: ^6.1.0
  protocol: ^0.0.3-dev.4
  # HTTP-сервер (BSD-3-Clause).
  shelf: ^1.4.3
  # Файл настроек (MIT).
  yaml: ^3.1.4

dev_dependencies:
  # Агент бэкапа по сети против настоящего координатора (5.1.3).
  agent: ^0.0.3-dev.4
  # Сквозные тесты CLI и узлов-заглушек против настоящего координатора.
  cli: ^0.0.3-dev.4
  daemon_kit: ^0.0.3-dev.4
  node: ^0.0.3-dev.4
  # Сквозные тесты relay (задача 3.8.2).
  relay: ^0.0.3-dev.4
  test: ^1.31.1
