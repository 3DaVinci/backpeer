name: core
description: Ядро (шифрование, erasure coding, чанкинг, форматы данных). Без Flutter.
version: 0.0.3-dev.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  # Запасной CryptoProvider на чистом Dart; hashlib ещё и HKDF, PBKDF2.
  cryptography: ^2.9.0
  # chmod через libc для прав файла ключей (задача 1.2.5).
  ffi: ^2.1.0
  fixnum: ^1.1.1
  hashlib: ^2.4.2
  # @immutable для типов-значений (ChunkId).
  meta: ^1.16.0
  # Tree, Node, Snapshot, Index из manifest.proto (задача 1.5.2).
  protobuf: ^6.1.0
  protocol: ^0.0.3-dev.1
  # Основной CryptoProvider: libsodium через FFI (решение 0.5.1).
  sodium: ^4.1.2
  # Локальный индекс (задача 1.3.4); библиотеку SQLite скачивает build hook
  # с проверкой SHA-256 (0.5.5).
  sqlite3: ^3.7.1
  # NFKC пароля (crypto.md, раздел 4). Версия точная: от неё зависит,
  # какой ключ получится из пароля. Выбор и проверка — задача 1.2.5.
  unorm_dart: 0.3.3

dev_dependencies:
  test: ^1.31.1
  test_vectors: ^0.0.3-dev.1
