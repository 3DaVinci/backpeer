version: 0.0.7
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  # Права на файлы, атомарная запись, hex, сравнение токена.
  core: ^0.0.7
  # Журнал JSON Lines (BSD-3-Clause, как у node).
  logging: ^1.3.0

dev_dependencies:
  test: ^1.31.1
