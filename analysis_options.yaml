# Общие правила анализа для всех пакетов монорепозитория.
# Пакеты не держат своих analysis_options.yaml: анализатор находит этот файл,
# поднимаясь по каталогам.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - .fvm/**
    - "**/build/**"
    - "**/*.g.dart"
    - "**/*.pb.dart"
    - "**/*.pbenum.dart"
    - "**/*.pbjson.dart"
    - "**/*.pbserver.dart"
    # Сгенерировано `flutter gen-l10n`: в Flutter 3.50 он ещё подставляет
    # делегаты GlobalMaterialLocalizations/GlobalCupertinoLocalizations из
    # flutter_localizations (объявлены устаревшими). Свои делегаты, из
    # material_ui, приложение собирает в apps/app/lib/src/app.dart.
    - apps/app/lib/l10n/app_localizations.dart
    - apps/app/lib/l10n/app_localizations_*.dart

linter:
  rules:
    # Пакеты внутренние и не публикуются; документацию публичного API
    # вводим позже, когда API стабилизируется.
    public_member_api_docs: false
