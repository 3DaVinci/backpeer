# Сборка артефактов на раннерах GitHub (ADR-014): мультиархитектурные
# образы (задача 6.2.2) и пакеты Linux (6.3.2).
#
# Запускается вручную или на тег: сборка артефактов не должна тратить
# минуты на каждой правке. Образы копятся в GitHub Container Registry
# (ghcr.io/<owner>/<repo>/<служба>), пакеты — в артефактах задания; на тег
# ещё создаётся релиз GitHub с файлами и SHA256SUMS. Страница загрузок
# сайта читает последний релиз при сборке (SITE_GITHUB_REPO, задача С.5.1).
#
# Ограничение: Flutter не выпускает SDK для Linux ARM64, поэтому .deb
# собирается только для amd64 — пакет для arm64 ждёт этого SDK либо
# сборки на устройстве (6.3.2, остаётся открытой). Образы при этом
# собираются для linux/amd64 и linux/arm64: всем службам хватает Dart.

name: packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: docker (${{ matrix.image }}, amd64 и arm64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [coordinator, node, relay, cli]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Имя образа в нижнем регистре
        id: image
        shell: bash
        # GHCR требует строчные имя и репозиторий: у зеркала 3DaVinci/backpeer
        # в имени есть заглавные буквы, docker отклоняет такой тег.
        run: |
          repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$repo/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - name: Вход в реестр
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Сборка образа для amd64 и arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          # На тег — публикуем в GHCR, иначе только собираем и проверяем.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  linux-packages:
    name: пакеты Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: SDK для скрипта сборки
        shell: bash
        run: |
          # tool/linux_package/build.sh монтирует .fvm/flutter_sdk в контейнер;
          # на раннере FVM нет, поэтому ссылаемся на SDK из flutter-action.
          mkdir -p .fvm
          ln -sfn "$(dirname "$(dirname "$(command -v flutter)")")" .fvm/flutter_sdk
      - name: Сборка AppImage, .deb и .rpm
        run: tool/linux_package/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: backpeer-linux-amd64
          path: build/packages/
          retention-days: 14

  # Релиз GitHub для страницы загрузок (С.5.1): файлы Linux и SHA256SUMS.
  # macOS .dmg подписывается на своём Mac и добавляется в релиз вручную
  # (5.7.2); установщик Windows появится после 5.7.1. Теги с `-` (dev) —
  # предварительные: сайт берёт только стабильный latest.
  release:
    name: релиз GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker, linux-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backpeer-linux-amd64
          path: release
      - name: Проверка файлов и хэшей
        run: |
          cd release
          ls -lh
          test -f SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Публикация
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Backpeer $GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            release/*
