// API координатора. Транспорт — HTTPS, тело запроса и ответа — Protobuf
// (docs/spec/protocol.md, раздел 4). Каждый RPC — POST /api/v1/<Метод>.
// В этой версии описаны методы этапов 1–3; аудиты, ремонт и relay
// зарезервированы и появятся в следующих версиях протокола.
syntax = "proto3";

package fs.v1;

import "fs/v1/common.proto";

// --- Учётная запись и устройства ---------------------------------------

// Регистрация учётной записи. Запрос подписан ключом учётной записи
// (контекст "api-request"), а не устройства. Правила — protocol.md,
// раздел 4.7.
message RegisterAccountRequest {
  Signed device_certificate = 1; // первое устройство
  bytes key_bundle = 2;          // KeyBundle (crypto.md, раздел 4.1) или пусто
  bytes auth_verifier = 3;       // открытый ключ входа (crypto.md, 4.4) или пусто
  string login = 4;              // имя для входа, нижний регистр
}
message RegisterAccountResponse {}

message AddDeviceRequest {
  Signed device_certificate = 1;
}
message AddDeviceResponse {}

// Устройства учётной записи, включая отозванные.
message ListDevicesRequest {}
message ListDevicesResponse {
  repeated DeviceInfo devices = 1;
}
message DeviceInfo {
  Signed certificate = 1;        // DeviceCertificate
  int64 added_at_unix_ms = 2;
  int64 revoked_at_unix_ms = 3;  // 0 — действует
}

// Отзыв устройства (потеряно или украдено). Запрос подписан ключом учётной
// записи; revocation — fs.v1.Signed с DeviceRevocation (контекст
// "device-revoke"). После отзыва координатор не принимает запросы и не
// выдаёт талоны этому устройству.
message RevokeDeviceRequest {
  Signed revocation = 1;
}
message RevokeDeviceResponse {}

// Отзывы устройств для узлов (подписан ключом узла), по возрастанию
// sequence.
message ListRevocationsRequest {
  uint64 after_sequence = 1;
  uint32 limit = 2;              // 0 — по умолчанию; не больше 1000
}
message ListRevocationsResponse {
  repeated RevocationEntry revocations = 1;
  bool more = 2;
}
message RevocationEntry {
  uint64 sequence = 1;
  Signed revocation = 2;         // DeviceRevocation
}

// Вход по паролю на новом устройстве (protocol.md, раздел 4.7; crypto.md,
// раздел 4.4). Оба запроса без подписи.
message GetLoginParamsRequest {
  string login = 1;
}
message GetLoginParamsResponse {
  bytes salt = 1;                // 16 байт
  uint32 memory_kib = 2;         // параметры Argon2id
  uint32 iterations = 3;
  uint32 parallelism = 4;
}

message GetKeyBundleRequest {
  reserved 1;                    // был account_id
  bytes auth_proof = 2;          // подпись ключом входа
  string login = 3;
  int64 time_unix_ms = 4;        // время в auth_proof
}
message GetKeyBundleResponse {
  bytes key_bundle = 1;
}

// Смена пароля или переход в режим без копии мастер-ключа (оба поля
// пусты). Подписан ключом учётной записи.
message SetKeyBundleRequest {
  bytes key_bundle = 1;
  bytes auth_verifier = 2;
}
message SetKeyBundleResponse {}

// --- Снимки и индексы (зашифрованные блобы) -------------------------------

enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED = 0;
  OBJECT_KIND_SNAPSHOT = 1;      // блоб типа 2
  OBJECT_KIND_INDEX = 2;         // блоб типа 3
}

message PutObjectRequest {
  ObjectKind kind = 1;
  bytes object_id = 2;
  bytes blob = 3;                // блоб целиком, до 8 МиБ
  uint64 sequence = 4;           // для снимка: Snapshot.sequence (открыто)
}
message PutObjectResponse {}

message ListObjectsRequest {
  ObjectKind kind = 1;
  bytes after_object_id = 2;     // постраничный вывод
  uint32 limit = 3;
}
message ListObjectsResponse {
  repeated ObjectInfo objects = 1;
  bool more = 2;
}
message ObjectInfo {
  bytes object_id = 1;
  uint32 size = 2;
  int64 stored_at_unix_ms = 3;
  uint64 sequence = 4;
}

message GetObjectRequest {
  ObjectKind kind = 1;
  bytes object_id = 2;
}
message GetObjectResponse {
  bytes blob = 1;
}

message DeleteObjectRequest {
  ObjectKind kind = 1;
  bytes object_id = 2;
}
message DeleteObjectResponse {}

// --- Размещение фрагментов --------------------------------------------------

// Клиент сообщает параметры нового сегмента и получает узлы и талоны PUT.
message AllocateSegmentRequest {
  bytes segment_id = 1;
  uint32 k = 2;
  uint32 n = 3;
  uint32 fragment_size = 4;          // заголовок + тело
  repeated bytes fragment_ids = 5;   // n штук
  repeated bytes body_roots = 6;     // n штук, для аудитов
  uint32 repair_threshold = 7;       // t: k ≤ t < n (durability.md)
}
message AllocateSegmentResponse {
  repeated Placement placements = 1; // n штук, по номеру фрагмента
}
message Placement {
  uint32 index = 1;
  NodeAddress node = 2;
  Signed ticket = 3;                 // FragmentTicket PUT
}
message NodeAddress {
  bytes node_id = 1;
  repeated string endpoints = 2;     // "host:port" для TCP
  bool needs_relay = 3;              // прямое соединение невозможно (этап 3)
}

// Клиент подтверждает, какие фрагменты загружены.
message CommitSegmentRequest {
  bytes segment_id = 1;
  repeated uint32 stored_indexes = 2;
}
message CommitSegmentResponse {}

// Где лежат фрагменты сегмента; талоны GET на чтение.
message LocateSegmentRequest {
  bytes segment_id = 1;
}
message LocateSegmentResponse {
  repeated Placement placements = 1; // доступные фрагменты, талоны GET
}

// Сборка мусора (manifest.md, раздел 7): сегмент больше не нужен.
// Координатор забывает его и выдаёт талоны DELETE на фрагменты; удаляет их
// с узлов клиент.
message DeleteSegmentRequest {
  bytes segment_id = 1;
}
message DeleteSegmentResponse {
  repeated Placement placements = 1; // талоны DELETE
}

// --- Узел -----------------------------------------------------------------

message RegisterNodeRequest {
  Signed node_certificate = 1;
  uint64 capacity_bytes = 2;
  repeated string endpoints = 3;
  repeated uint32 versions = 4;
  string software = 5;
}
message RegisterNodeResponse {
  // Ключи, которыми координатор подписывает талоны сейчас; узел сверяет их
  // с вшитым списком (protocol.md, раздел 5.1), но доверяет только ему.
  repeated bytes coordinator_keys = 1;
}

message HeartbeatRequest {
  uint64 used_bytes = 1;
  uint64 capacity_bytes = 2;
  repeated string endpoints = 3;
  // Сколько ещё байт фрагментов узел готов принять сейчас: меньшее из
  // остатка квоты и свободного места на диске за вычетом запаса
  // (protocol.md, раздел 4.9). Нет поля — узел не сообщает, координатор
  // считает по ёмкости.
  optional uint64 free_bytes = 4;
}
message HeartbeatResponse {
  uint32 next_heartbeat_ms = 1;
}

// Узел нашёл у себя фрагменты, не прошедшие проверку целостности или
// пропавшие с диска (фоновая проверка, задача 3.2.4). Обработка — ремонт
// (этап 4).
message ReportDamagedFragmentsRequest {
  repeated bytes fragment_ids = 1; // до 1000, по 32 байта
}
message ReportDamagedFragmentsResponse {
  // Сколько из перечисленных фрагментов координатор знает на этом узле;
  // остальные — фрагменты без ссылок (например, неподтверждённых сегментов).
  uint32 known = 1;
}
