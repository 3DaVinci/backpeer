name: app
description: Настольное приложение (Flutter) для клиентов и хранителей — интерфейс к фоновым процессам node и агенту бэкапа.
version: 0.0.8-dev.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  # Каталог программы и сокет агента бэкапа (AgentPaths).
  agent: ^0.0.8-dev.1
  # Каталог программы (AppHome), общий с CLI и агентом.
  cli: ^0.0.8-dev.1
  # Версия программы (appVersion).
  core: ^0.0.8-dev.1
  # Клиент локального API фоновых процессов.
  daemon_kit: ^0.0.8-dev.1
  # Выбор папки диалогом ОС (BSD-3-Clause).
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Сообщения и форматы чисел и дат для gen-l10n (BSD-3-Clause).
  intl: ^0.20.2
  # Папка данных и сокет демона хранителя (defaultNodeDataDir).
  node: ^0.0.8-dev.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
