name: relay
description: Relay — ретранслятор соединений к узлам за NAT (задача 3.8). Без Flutter.
version: 0.0.2
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  # Команды keygen, public-key, serve (BSD-3-Clause), как у подписанта.
  args: ^2.7.0
  core: ^0.0.2
  # Int64 полей Protobuf (BSD-3-Clause, уже в core).
  fixnum: ^1.1.1
  # Журнал JSON Lines, как у координатора (BSD-3-Clause).
  logging: ^1.3.0
  protocol: ^0.0.2
  # Файл настроек (MIT), как у координатора и узла.
  yaml: ^3.1.4

dev_dependencies:
  test: ^1.31.1
