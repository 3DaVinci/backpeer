# Пример настроек координатора (docs/ops/coordinator.md). Любой ключ можно
# переопределить переменной FS_COORDINATOR_<РАЗДЕЛ>_<КЛЮЧ>, например
# FS_COORDINATOR_DATABASE_PASSWORD.

listen:
  host: 127.0.0.1
  port: 8443
  # Координатор за обратным прокси (nginx, Caddy): адрес клиента — из
  # последнего значения X-Forwarded-For. Без прокси — false, иначе клиент
  # подставит любой адрес и обойдёт ограничение частоты по IP.
  trust_forwarded_for: true

# TLS самого координатора. Без этого раздела сервер слушает HTTP, и TLS
# должен завершать прокси.
# tls:
#   certificate: /etc/fs-coordinator/fullchain.pem
#   private_key: /etc/fs-coordinator/privkey.pem

database:
  host: 127.0.0.1
  port: 5432
  name: fs_coordinator
  user: fs_coordinator
  # Пароль — не в этом файле: FS_COORDINATOR_DATABASE_PASSWORD или файл
  # (права 0600, владелец — пользователь координатора).
  # password_file: /etc/fs-coordinator/db-password
  ssl: verify-full
  max_connections: 10

limits:
  ip_per_second: 50
  ip_burst: 200
  key_per_second: 20
  key_burst: 100
  # Вход по паролю (GetLoginParams, GetKeyBundle) по IP, в минуту.
  login_per_minute: 10
  login_burst: 20

accounts:
  # Действующих устройств на учётную запись.
  max_devices: 5
  # Объём снимков и индексов на учётную запись, байт (1 ГиБ).
  max_object_bytes: 1073741824

nodes:
  # Минимум места у хранителя, байт (100 ГБ).
  min_capacity_bytes: 100000000000
  # Действующих узлов на учётную запись владельца.
  max_per_account: 20
  # Период heartbeat; узел вне сети, если молчит три периода.
  heartbeat_seconds: 300

placement:
  # Доступность узла за 30 дней, не ниже которой он получает фрагменты.
  min_availability: 0.6
  # Испытательный срок нового узла и доля сегмента для таких узлов.
  probation_hours: 72
  max_probation_share: 0.25
  # Срок жизни талонов, минут (не больше 60 и предела подписанта).
  ticket_minutes: 30

# Геоданные узлов для карты на сайте (задача С.3.5). Папка с CSV-файлами
# DB-IP Lite (dbip-city-lite-*.csv или dbip-country-lite-*.csv, можно .gz).
# Данные DB-IP Lite — CC BY 4.0, на сайте нужна ссылка на db-ip.com.
# Без раздела узлы остаются без места, и карта пуста.
# geoip:
#   dir: /var/lib/fs-coordinator/geoip

# Публичная сводка о сети для сайта: GET /api/v1/NetworkStats без подписи.
# Только числа и города, без списка узлов. stats.origins — адреса сайта,
# которым браузер разрешает чтение (CORS); пустой список — сводку читают
# только прямыми запросами.
stats:
  enabled: true
  origins:
    - https://backpeer.app.tridavinci.org
  # Предел запросов сводки с одного IP в минуту и срок кеша ответа.
  per_minute: 60
  max_age_seconds: 60
  # Города, где меньше узлов, на карту не попадают (1 — попадают все).
  min_city_hosts: 1

# Подписант талонов (docs/ops/coordinator.md, раздел «Подписант»). Без него
# размещение сегментов недоступно.
signer:
  socket: /run/fs-signer/signer.sock

log:
  level: info
