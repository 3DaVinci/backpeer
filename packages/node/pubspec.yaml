name: node
description: Демон хранителя (в том числе headless для NAS и Raspberry Pi). Без Flutter.
version: 0.0.2
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  # Команды демона и узла-заглушки (BSD-3-Clause, как в cli).
  args: ^2.7.0
  core: ^0.0.2
  # Локальный API, журнал, блокировка папки — общие с агентом бэкапа.
  daemon_kit: any
  # fsync каталога и свободное место на диске через libc и kernel32
  # (BSD-3-Clause, уже в core).
  ffi: ^2.1.0
  # Int64 полей Protobuf (BSD-3-Clause, уже в core).
  fixnum: ^1.1.1
  # Журнал демона; формат JSON Lines и ротация — свои (BSD-3-Clause).
  logging: ^1.3.0
  protocol: ^0.0.2
  # Индекс фрагментов и использованных талонов (MIT, уже в core).
  sqlite3: ^3.7.1
  # Файл настроек демона (MIT), как у координатора.
  yaml: ^3.1.4

dev_dependencies:
  # Тесты операций с фрагментами через relay (задача 3.8.1).
  relay: ^0.0.2
  test: ^1.31.1
  # Контракт FragmentStore из core/test для NetworkFragmentStore (3.9.2).
  test_vectors: ^0.0.2
