name: agent
description: Агент бэкапа — фоновый процесс клиента по ADR-008 (расписание, бэкап, проверка и восстановление в фоне). Без Flutter.
version: 0.0.8-dev.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  # Команды агента (BSD-3-Clause, как в cli и node).
  args: ^2.7.0
  # Каталог программы, config.json и сборка хранилищ — общие с CLI.
  cli: ^0.0.8-dev.0
  core: ^0.0.8-dev.0
  # Локальный API, журнал, блокировка папки — общие с node.
  daemon_kit: ^0.0.8-dev.0
  # libsecret и GLib для Secret Service на Linux (BSD-3-Clause, уже в core).
  ffi: ^2.1.0
  # Журнал JSON Lines (BSD-3-Clause, как у node).
  logging: ^1.3.0
  # Ключи и сертификат узла, настройки и свободное место — при включении
  # роли хранителя из приложения (5.5.1). Свой пакет.
  node: ^0.0.8-dev.0
  protocol: ^0.0.8-dev.0

dev_dependencies:
  test: ^1.31.1
