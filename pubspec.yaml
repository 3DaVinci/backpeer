name: file_storage_workspace
description: Корень монорепозитория (pub workspace + melos).
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/core
  - packages/protocol
  - packages/cli
  - packages/node
  - packages/coordinator
  - apps/app
  - prototypes/bench

dev_dependencies:
  melos: ^8.9.0
  very_good_analysis: ^11.0.0

melos:
  sdkPath: .fvm/flutter_sdk

  command:
    version:
      # Единая версия продукта для всех пакетов и один тег vX.Y.Z на релиз.
      # Подробности в CONTRIBUTING.md.
      mode: fixed
      workspaceTag: true
      versionPrivatePackages: true
      branch: main
      linkToCommits: false
      workspaceChangelog: true

  scripts:
    check-deps:
      description: Проверить, что пакеты ядра не зависят от Flutter.
      run: dart run tool/check_no_flutter.dart

    lint:
      description: Форматирование, анализатор и правило зависимостей.
      steps:
        - format --output none --set-exit-if-changed
        - dart format --output none --set-exit-if-changed tool
        - dart analyze --fatal-infos
        - check-deps

    check:
      description: Все локальные проверки (как в pre-commit хуке) и тесты.
      steps:
        - lint
        - dart run melos:melos test

    coverage-dart:
      description: Тесты Dart-пакетов с покрытием (coverage/lcov.info).
      exec:
        command: dart test --coverage-path=coverage/lcov.info
        concurrency: 1
      packageFilters:
        flutter: false
        dirExists: test

    coverage-flutter:
      description: Тесты Flutter-пакетов с покрытием (coverage/lcov.info).
      exec:
        command: flutter test --coverage
        concurrency: 1
      packageFilters:
        flutter: true
        dirExists: test

    coverage:
      description: Тесты с покрытием и сводный отчёт в coverage/ (lcov и Cobertura).
      steps:
        - coverage-dart
        - coverage-flutter
        - dart run tool/coverage_report.dart

    build-exe:
      description: Собрать cli и node под текущую платформу в build/bin/.
      run: dart run tool/build_exe.dart
