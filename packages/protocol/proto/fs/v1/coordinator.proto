// API координатора. Транспорт — HTTPS, тело запроса и ответа — Protobuf
// (docs/spec/protocol.md, раздел 4). Каждый RPC — POST /api/v1/<Метод>.
// В этой версии описаны методы этапов 1–3; аудиты и ремонт зарезервированы
// и появятся в следующих версиях протокола.
syntax = "proto3";

package fs.v1;

import "fs/v1/common.proto";

// --- Учётная запись и устройства ---------------------------------------

// Регистрация учётной записи. Запрос подписан ключом учётной записи
// (контекст "api-request"), а не устройства. Правила — protocol.md,
// раздел 4.7.
message RegisterAccountRequest {
  Signed device_certificate = 1; // первое устройство
  bytes key_bundle = 2;          // KeyBundle (crypto.md, раздел 4.1) или пусто
  bytes auth_verifier = 3;       // открытый ключ входа (crypto.md, 4.4) или пусто
  string login = 4;              // имя для входа, нижний регистр
}
message RegisterAccountResponse {}

message AddDeviceRequest {
  Signed device_certificate = 1;
}
message AddDeviceResponse {}

// Устройства учётной записи, включая отозванные.
message ListDevicesRequest {}
message ListDevicesResponse {
  repeated DeviceInfo devices = 1;
}
message DeviceInfo {
  Signed certificate = 1;        // DeviceCertificate
  int64 added_at_unix_ms = 2;
  int64 revoked_at_unix_ms = 3;  // 0 — действует
}

// Отзыв устройства (потеряно или украдено). Запрос подписан ключом учётной
// записи; revocation — fs.v1.Signed с DeviceRevocation (контекст
// "device-revoke"). После отзыва координатор не принимает запросы и не
// выдаёт талоны этому устройству.
message RevokeDeviceRequest {
  Signed revocation = 1;
}
message RevokeDeviceResponse {}

// Отзывы устройств для узлов (подписан ключом узла), по возрастанию
// sequence.
message ListRevocationsRequest {
  uint64 after_sequence = 1;
  uint32 limit = 2;              // 0 — по умолчанию; не больше 1000
}
message ListRevocationsResponse {
  repeated RevocationEntry revocations = 1;
  bool more = 2;
}
message RevocationEntry {
  uint64 sequence = 1;
  Signed revocation = 2;         // DeviceRevocation
}

// Вход по паролю на новом устройстве (protocol.md, раздел 4.7; crypto.md,
// раздел 4.4). Оба запроса без подписи.
message GetLoginParamsRequest {
  string login = 1;
}
message GetLoginParamsResponse {
  bytes salt = 1;                // 16 байт
  uint32 memory_kib = 2;         // параметры Argon2id
  uint32 iterations = 3;
  uint32 parallelism = 4;
}

message GetKeyBundleRequest {
  reserved 1;                    // был account_id
  bytes auth_proof = 2;          // подпись ключом входа
  string login = 3;
  int64 time_unix_ms = 4;        // время в auth_proof
}
message GetKeyBundleResponse {
  bytes key_bundle = 1;
}

// Смена пароля или переход в режим без копии мастер-ключа (оба поля
// пусты). Подписан ключом учётной записи.
message SetKeyBundleRequest {
  bytes key_bundle = 1;
  bytes auth_verifier = 2;
}
message SetKeyBundleResponse {}

// --- Снимки и индексы (зашифрованные блобы) -------------------------------

enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED = 0;
  OBJECT_KIND_SNAPSHOT = 1;      // блоб типа 2
  OBJECT_KIND_INDEX = 2;         // блоб типа 3
}

message PutObjectRequest {
  ObjectKind kind = 1;
  bytes object_id = 2;
  bytes blob = 3;                // блоб целиком, до 8 МиБ
  uint64 sequence = 4;           // для снимка: Snapshot.sequence (открыто)
}
message PutObjectResponse {}

message ListObjectsRequest {
  ObjectKind kind = 1;
  bytes after_object_id = 2;     // постраничный вывод
  uint32 limit = 3;
}
message ListObjectsResponse {
  repeated ObjectInfo objects = 1;
  bool more = 2;
}
message ObjectInfo {
  bytes object_id = 1;
  uint32 size = 2;
  int64 stored_at_unix_ms = 3;
  uint64 sequence = 4;
}

message GetObjectRequest {
  ObjectKind kind = 1;
  bytes object_id = 2;
}
message GetObjectResponse {
  bytes blob = 1;
}

message DeleteObjectRequest {
  ObjectKind kind = 1;
  bytes object_id = 2;
}
message DeleteObjectResponse {}

// --- Размещение фрагментов --------------------------------------------------

// Клиент сообщает параметры нового сегмента и получает узлы и талоны PUT.
message AllocateSegmentRequest {
  bytes segment_id = 1;
  uint32 k = 2;
  uint32 n = 3;
  uint32 fragment_size = 4;          // заголовок + тело
  repeated bytes fragment_ids = 5;   // n штук
  repeated bytes body_roots = 6;     // n штук, для аудитов
  uint32 repair_threshold = 7;       // t: k ≤ t < n (durability.md)
}
message AllocateSegmentResponse {
  repeated Placement placements = 1; // n штук, по номеру фрагмента
}
message Placement {
  uint32 index = 1;
  NodeAddress node = 2;
  Signed ticket = 3;                 // FragmentTicket PUT
}
message NodeAddress {
  bytes node_id = 1;
  repeated string endpoints = 2;     // "host:port" для TCP
  bool needs_relay = 3;              // прямое соединение невозможно (этап 3)
}

// Клиент подтверждает, какие фрагменты загружены.
message CommitSegmentRequest {
  bytes segment_id = 1;
  repeated uint32 stored_indexes = 2;
}
message CommitSegmentResponse {}

// Где лежат фрагменты сегмента; талоны GET на чтение.
message LocateSegmentRequest {
  bytes segment_id = 1;
}
message LocateSegmentResponse {
  repeated Placement placements = 1; // доступные фрагменты, талоны GET
}

// Сборка мусора (manifest.md, раздел 7): сегмент больше не нужен.
// Координатор забывает его и выдаёт талоны DELETE на фрагменты; удаляет их
// с узлов клиент.
message DeleteSegmentRequest {
  bytes segment_id = 1;
}
message DeleteSegmentResponse {
  repeated Placement placements = 1; // талоны DELETE
}

// --- Узел -----------------------------------------------------------------

message RegisterNodeRequest {
  Signed node_certificate = 1;
  uint64 capacity_bytes = 2;
  repeated string endpoints = 3;
  repeated uint32 versions = 4;
  string software = 5;
}
message RegisterNodeResponse {
  // Ключи, которыми координатор подписывает талоны сейчас; узел сверяет их
  // с вшитым списком (protocol.md, раздел 5.1), но доверяет только ему.
  repeated bytes coordinator_keys = 1;
}

message HeartbeatRequest {
  uint64 used_bytes = 1;
  uint64 capacity_bytes = 2;
  repeated string endpoints = 3;
  // Сколько ещё байт фрагментов узел готов принять сейчас: меньшее из
  // остатка квоты и свободного места на диске за вычетом запаса
  // (protocol.md, раздел 4.9). Нет поля — узел не сообщает, координатор
  // считает по ёмкости.
  optional uint64 free_bytes = 4;
}
message HeartbeatResponse {
  uint32 next_heartbeat_ms = 1;
  // Как координатор видит узел сейчас — для статистики хранителя в
  // приложении (задача 5.5.2). Нет поля — старый координатор.
  NodeStanding standing = 2;
}

// Положение узла у координатора (protocol.md, раздел 4.9).
message NodeStanding {
  double availability = 1;            // доля времени в сети за 30 дней, 0..1
  double reputation = 2;              // docs/spec/reputation.md, 0..1
  bool on_probation = 3;              // испытательный срок (задача 4.2.2)
  int64 probation_ends_unix_ms = 4;   // конец испытательного срока
  uint64 audits_passed = 5;
  uint64 audits_failed = 6;
  bool excluded = 7;                  // исключён: аудиты или оператор
  int64 registered_unix_ms = 8;
}

// Узел нашёл у себя фрагменты, не прошедшие проверку целостности или
// пропавшие с диска (фоновая проверка, задача 3.2.4). Обработка — ремонт
// (этап 4).
message ReportDamagedFragmentsRequest {
  repeated bytes fragment_ids = 1; // до 1000, по 32 байта
}
message ReportDamagedFragmentsResponse {
  // Сколько из перечисленных фрагментов координатор знает на этом узле;
  // остальные — фрагменты без ссылок (например, неподтверждённых сегментов).
  uint32 known = 1;
}

// Проверка достижимости (задача 3.5.1): координатор подключается по TCP к
// адресу, с которого пришёл запрос, на каждый порт из списка и начинает
// рукопожатие Noise XX; порт достижим, если отвечающий во втором сообщении
// показал статический ключ node_dh из сертификата узла (protocol.md,
// раздел 4.9). Другие адреса координатор не проверяет: иначе узел мог бы
// направить его соединения куда угодно.
message CheckReachabilityRequest {
  repeated uint32 ports = 1; // от 1 до 4 разных портов 1–65535
}
message CheckReachabilityResponse {
  // Адрес, с которого пришёл запрос (IPv4 или IPv6 без скобок и порта):
  // внешний адрес узла, каким его видит координатор.
  string observed_address = 1;
  repeated ReachabilityResult results = 2; // в порядке ports запроса
}
message ReachabilityResult {
  uint32 port = 1;
  ReachabilityStatus status = 2;
}
enum ReachabilityStatus {
  REACHABILITY_STATUS_UNSPECIFIED = 0;
  REACHABILITY_STATUS_REACHABLE = 1;   // ответил этот узел
  REACHABILITY_STATUS_REFUSED = 2;     // соединение отклонено
  REACHABILITY_STATUS_TIMEOUT = 3;     // нет ответа за отведённое время
  REACHABILITY_STATUS_WRONG_PEER = 4;  // ответил не этот узел или не Noise
  REACHABILITY_STATUS_NOT_CHECKED = 5; // адрес не публичный (настройка координатора)
}

// --- Канал команд координатора (задача 3.6.1) -------------------------------
//
// Узел держит исходящее соединение WebSocket к координатору:
// GET /api/v1/NodeChannel с подписью FS-Auth ключом узла над путём и пустым
// телом (protocol.md, раздел 4.10). Каждый двоичный кадр WebSocket — одно
// сообщение: от узла — NodeChannelMessage, от координатора —
// CoordinatorChannelMessage. Каждая сторона нумерует свои запросы (id от 1,
// по возрастанию); ответ несёт reply_to — номер запроса другой стороны.
// Новые команды — новые варианты oneof: узел отвечает на незнакомую команду
// ошибкой BAD_REQUEST, канал не закрывается.

message NodeChannelMessage {
  uint64 id = 1;                       // номер запроса узла; у ответа 0
  uint64 reply_to = 2;                 // номер команды координатора; у запроса 0
  oneof body {
    HeartbeatRequest heartbeat = 3;    // запрос: heartbeat по каналу
    CommandDone done = 4;              // ответ: команда принята
    Error error = 5;                   // ответ: команда отклонена
    RendezvousReply rendezvous = 6;    // ответ на RendezvousCommand
    AuditReply audit = 7;              // ответ на AuditCommand
  }
}

message CoordinatorChannelMessage {
  uint64 id = 1;                       // номер команды; у ответа 0
  uint64 reply_to = 2;                 // номер запроса узла; у команды 0
  oneof body {
    HeartbeatResponse heartbeat = 3;   // ответ на heartbeat
    Error error = 4;                   // ответ ошибкой на запрос узла
    PingCommand ping = 5;
    SyncRevocationsCommand sync_revocations = 6;
    RendezvousCommand rendezvous = 7;
    AuditCommand audit = 8;
  }
}

message CommandDone {}

// Проверка канала: узел отвечает CommandDone.
message PingCommand {}

// Появился отзыв устройства с номером sequence (ListRevocations): узел,
// у которого номер последнего полученного отзыва меньше, дочитывает список.
message SyncRevocationsCommand {
  uint64 sequence = 1;
}

// --- Сведение узлов, UDP hole punching (задача 3.7.2) -----------------------
//
// protocol.md, раздел 4.11. Сводник — UDP-служба координатора на двух
// портах: на запрос он сообщает отправителю его внешний адрес и порт с
// подтверждением (token), которое проверяет координатор. Так ни инициатор,
// ни узел не направят пакеты другой стороны на чужой адрес.

// Адреса сводника. Подписан ключом устройства или узла.
message GetRendezvousInfoRequest {}
message GetRendezvousInfoResponse {
  // Два адреса "IPv4:порт" — порты сводника; пусто — сведение выключено.
  repeated string servers = 1;
}

// Внешний UDP-адрес стороны, каким его увидел сводник.
message UdpBinding {
  string endpoint = 1;               // "IPv4:порт"
  bytes token = 2;                   // подтверждение сводника, 20 байт
}

// Инициатор (клиент или узел при ремонте) просит свести его с узлом.
// Подписан ключом устройства или узла.
message RendezvousRequest {
  bytes node_id = 1;
  UdpBinding binding = 2;            // внешний адрес инициатора
}
message RendezvousResponse {
  string node_endpoint = 1;          // внешний адрес узла, "IPv4:порт"
  bytes punch_id = 2;                // номер сведения, 16 байт
  bool node_symmetric_nat = 3;       // у узла симметричный NAT: сведение не удастся
}

// Команда узлу: начать пробивание к инициатору.
message RendezvousCommand {
  string peer_endpoint = 1;          // внешний адрес инициатора
  bytes peer_key = 2;                // ключ, которым подписан запрос инициатора
  bytes punch_id = 3;
  repeated string servers = 4;       // адреса сводника
}

// Ответ узла: его внешний адрес от сводника.
message RendezvousReply {
  UdpBinding binding = 1;
  bool symmetric_nat = 2;
}

// --- Аудиты (задачи 4.1.1–4.1.4) --------------------------------------------
//
// protocol.md, раздел 4.13. Координатор просит у узла случайный блок
// хранимого фрагмента; узел отвечает блоком и путём в дереве Меркла тела
// (data-format.md, раздел 5), координатор сверяет их с body_root из
// AllocateSegmentRequest.body_roots. Пересылать фрагмент целиком не нужно,
// а ответить, не храня блок, нельзя.

// Команда узлу: доказать хранение блока block_index фрагмента fragment_id.
message AuditCommand {
  bytes fragment_id = 1;             // 32 байта
  uint32 block_index = 2;            // номер блока тела, от 0
}

// Ответ узла. Фрагмента нет или он повреждён — Error с NOT_FOUND.
message AuditReply {
  bytes block = 1;                   // блок тела: 65 536 байт, последний короче
  repeated bytes path = 2;           // путь от листа к корню, по 32 байта (RFC 6962)
}

// --- Relay (задачи 3.8.1–3.8.3) ----------------------------------------------
//
// protocol.md, раздел 4.12. Relay — отдельный сервер; координатор выдаёт
// пропуска к нему (RelayPass, relay.proto), ведёт объём трафика через relay
// на учётную запись и собирает метрики: отчёты relay и отчёты клиентов о
// трафике по способам подключения.

// Пропуск к relay. Узел (ключ узла, node_id — свой) получает пропуск
// LISTEN: держать управляющее соединение и принимать через relay.
// Устройство или узел при ремонте (node_id — другой узел) — CONNECT к узлу.
message GetRelayPassRequest {
  bytes node_id = 1;
}
message GetRelayPassResponse {
  string relay_endpoint = 1;         // "хост:порт" relay для TCP
  Signed pass = 2;                   // RelayPass, контекст "relay-pass"
}

// Отчёт relay о трафике с прошлого отчёта. Подписан ключом relay.
message ReportRelayUsageRequest {
  string relay = 1;                  // имя relay
  repeated RelayAccountUsage usage = 2;
  uint32 listeners = 3;              // узлов с управляющим соединением сейчас
  uint32 sessions = 4;               // сеансов ретрансляции сейчас
  uint64 sessions_opened = 5;        // новых сеансов с прошлого отчёта
  uint64 bytes = 6;                  // байт через relay с прошлого отчёта, в обе стороны
}
message RelayAccountUsage {
  bytes account_id = 1;              // из пропуска CONNECT
  uint64 bytes = 2;
  uint32 sessions = 3;
}
message ReportRelayUsageResponse {
  uint32 next_report_ms = 1;         // через сколько прислать следующий
}

// Способ, которым клиент или узел соединился с узлом.
enum ConnectionMethod {
  CONNECTION_METHOD_UNSPECIFIED = 0;
  CONNECTION_METHOD_DIRECT = 1;      // прямой TCP
  CONNECTION_METHOD_UDP = 2;         // поток поверх UDP после сведения
  CONNECTION_METHOD_RELAY = 3;
}

// Отчёт клиента или узла о трафике фрагментов с прошлого отчёта: доля
// relay в трафике сети (контрольная точка 3.10.4). Подписан ключом
// устройства или узла.
message ReportTrafficRequest {
  repeated TrafficByMethod traffic = 1; // не больше одной записи на способ
}
message TrafficByMethod {
  ConnectionMethod method = 1;
  uint64 bytes = 2;                  // в обе стороны
  uint32 connections = 3;            // новых соединений
}
message ReportTrafficResponse {}
