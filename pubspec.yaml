name: backpeer_workspace
description: Корень монорепозитория (pub workspace + melos).
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/core
  - packages/protocol
  - packages/cli
  - packages/daemon_kit
  - packages/node
  - packages/agent
  - packages/coordinator
  - packages/relay
  - packages/test_vectors
  - apps/app
  - prototypes/bench

dev_dependencies:
  # Инструменты в tool/ (например, tool/updates/sign.dart) используют
  # пакеты рабочего пространства.
  core: any
  melos: ^8.9.0
  very_good_analysis: ^11.0.0

melos:
  sdkPath: .fvm/flutter_sdk

  command:
    version:
      # Единая версия продукта для всех пакетов и один тег vX.Y.Z на релиз.
      # Подробности в CONTRIBUTING.md.
      mode: fixed
      workspaceTag: true
      versionPrivatePackages: true
      branch: main
      linkToCommits: false
      workspaceChangelog: true

  scripts:
    check-deps:
      description: Проверить, что пакеты ядра не зависят от Flutter.
      run: dart run tool/check_no_flutter.dart

    lint:
      description: Форматирование, анализатор и правило зависимостей.
      steps:
        - format --output none --set-exit-if-changed
        - dart format --output none --set-exit-if-changed tool
        - dart analyze --fatal-infos
        - check-deps

    check:
      description: Все локальные проверки (как в pre-commit хуке) и тесты.
      steps:
        - lint
        - test-dart
        - test-serial
        - test-flutter

    # Тесты врозь, как в CI (docs/ci.md, раздел «Параллельность тестов»):
    # замеры памяти и времени (тег serial) идут по одному файлу, иначе пик
    # RSS процесса складывается из соседних файлов и замер не проходит.
    test-dart:
      description: Тесты Dart-пакетов, кроме тега serial.
      exec:
        command: dart test -j "${FS_TEST_JOBS:-4}" -x serial
        concurrency: 1
      packageFilters:
        flutter: false
        dirExists: test

    test-serial:
      description: Тесты с тегом serial (замеры памяти и времени) по одному файлу.
      exec:
        command: dart test -j 1 -t serial
        concurrency: 1
      packageFilters:
        scope: [core, node]

    # Число одновременно идущих тестовых файлов — FS_TEST_JOBS (по умолчанию
    # 4). Без -j dart test берёт число ядер машины: в поде Kubernetes это
    # ядра всего узла, а не лимит пода, и тесты мешают друг другу
    # (docs/ci.md, раздел «Параллельность тестов»).
    coverage-dart:
      description: Тесты Dart-пакетов с покрытием (coverage/lcov.info), кроме тега serial.
      exec:
        command: dart test -j "${FS_TEST_JOBS:-4}" -x serial --coverage-path=coverage/lcov.info
        concurrency: 1
      packageFilters:
        flutter: false
        dirExists: test

    coverage-serial:
      description: Тесты с тегом serial (замеры памяти и времени) по одному файлу (coverage/serial.lcov.info).
      exec:
        command: dart test -j 1 -t serial --coverage-path=coverage/serial.lcov.info
        concurrency: 1
      packageFilters:
        scope: [core, node]

    coverage-flutter:
      description: Тесты Flutter-пакетов с покрытием (coverage/lcov.info).
      exec:
        command: flutter test --coverage
        concurrency: 1
      packageFilters:
        flutter: true
        dirExists: test

    test-flutter:
      description: Тесты Flutter-пакетов (приложение).
      exec:
        command: flutter test
        concurrency: 1
      packageFilters:
        flutter: true
        dirExists: test

    coverage:
      description: Тесты с покрытием и сводный отчёт в coverage/ (lcov и Cobertura).
      steps:
        - coverage-dart
        - coverage-serial
        - coverage-flutter
        - dart run tool/coverage_report.dart

    build-exe:
      description: Собрать cli, node и agent под текущую платформу в build/bin/.
      run: dart run tool/build_exe.dart

    macos:build:
      description: macOS — Backpeer.app с программами внутри и .dmg (нужен Mac с Xcode, docs/ops/macos-packages.md).
      run: tool/macos_package/build.sh

    site:check:
      description: Сайт (apps/site, нужен Node.js 22+) — типы, сборка и тесты, как задание site в CI.
      run: cd apps/site && npm ci && npm run check

    site:dev:
      description: Сайт в режиме разработки на http://127.0.0.1:5173/.
      run: cd apps/site && npm run dev
